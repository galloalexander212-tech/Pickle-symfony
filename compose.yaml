services:

    ###> doctrine/doctrine-bundle ###
    database:
        image: mysql:8.0
        container_name: webprog-db
        restart: unless-stopped
        environment:
            MYSQL_ROOT_PASSWORD: secret
            MYSQL_DATABASE: webprog
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psecret"]
            timeout: 5s
            retries: 5
            interval: 10s
        volumes:
            - webprog_mysql_data:/var/lib/mysql:rw
    ###< doctrine/doctrine-bundle ###

volumes:
    webprog_mysql_data: